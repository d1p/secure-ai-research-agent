# tinyproxy config — proxy-dev (coding runner egress, allowlist only)
# Only package/download domains may be reached. See dev-filter.txt.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 20
Allow 0.0.0.0/0
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/filter"
FilterURLs On
FilterExtended On
FilterDefaultDeny Yes
ViaProxyName "tinyproxy"
