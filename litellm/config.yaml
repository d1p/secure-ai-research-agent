# =============================================================================
# LiteLLM proxy configuration
#
# LiteLLM is the ONLY route from agents/application services to cloud model
# providers.  Credentials are injected from the environment (os.environ/...),
# never committed here.  See README.md for model-ID caveats.
# =============================================================================

model_list:
  - model_name: bedrock-claude-sonnet
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: os.environ/AWS_REGION
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY

  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

litellm_settings:
  # Default model when the client does not request one.
  default_model: deepseek-flash
  # Drop provider params the client did not request.
  drop_params: true
  # Capture prompts/responses in OTel traces (Tempo).  The spend-log DB stays
  # prompt-free via `store_prompts_in_spend_logs: false` below.
  turn_off_message_logging: false
  # Global monthly budget: USD 50 over a 30-day window (requires Postgres).
  max_budget: 50
  budget_duration: 30d
  # Pre-call secret guard + Prometheus metrics + OpenTelemetry tracing.
  callbacks: ["secret_guard.secret_guard_handler", "prometheus", "otel"]

general_settings:
  # Persist model/key state in Postgres (DATABASE_URL env var).
  store_model_in_db: true
  # Do not store prompt text in the spend log.
  store_prompts_in_spend_logs: false
