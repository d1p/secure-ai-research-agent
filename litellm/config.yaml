# =============================================================================
# LiteLLM proxy configuration
#
# LiteLLM is the ONLY route from agents/application services to cloud model
# providers.  Credentials are injected from the environment (os.environ/...),
# never committed here.  See README.md for model-ID caveats.
# =============================================================================

model_list:
  # Cloud chat
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # ---------------------------------------------------------------------------
  # LM Studio (LAN inference, OpenAI-compatible API at LMSTUDIO_BASE_URL).
  # Reached from the container only via the non-internal `egress` network.
  # LM Studio ignores the API key, but LiteLLM requires a non-empty value.
  # ---------------------------------------------------------------------------
  - model_name: lmstudio-gemma-4-12b
    litellm_params:
      model: openai/google/gemma-4-12b-qat
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY

  # Ollama embedding (local, `bge-m3`, 1024-dim) — used by RAG wherever
  # embeddings are needed (Open WebUI points its RAG at Ollama directly).
  - model_name: ollama-bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434
    model_info:
      mode: embedding

litellm_settings:
  # Default model when the client does not request one.
  default_model: deepseek-flash
  # Retry transient provider drops (DeepSeek occasionally closes streams).
  num_retries: 3
  request_timeout: 600
  # Drop provider params the client did not request.
  drop_params: true
  # OTel traces carry usage/cost span attributes only; message content capture
  # is disabled in docker-compose (NO_CONTENT). Spend logs stay prompt-free via
  # `store_prompts_in_spend_logs: false` below.
  turn_off_message_logging: false
  # Global monthly budget: USD 50 over a 30-day window (requires Postgres).
  max_budget: 50
  budget_duration: 30d
  # Pre-call secret guard + Prometheus metrics + OpenTelemetry tracing.
  callbacks: ["secret_guard.secret_guard_handler", "prometheus", "otel"]

general_settings:
  # Persist model/key state in Postgres (DATABASE_URL env var).
  store_model_in_db: true
  # Do not store prompt text in the spend log.
  store_prompts_in_spend_logs: false
