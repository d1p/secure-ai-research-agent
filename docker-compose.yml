# =============================================================================
# AI Stack — Docker Compose topology
# Networks, resource limits, healthchecks, log rotation, volumes.
# Two host ports only: ${BIND_IP}:3000 (Open WebUI) and ${BIND_IP}:6080 (noVNC).
# =============================================================================

x-logging: &logging
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  restart: unless-stopped

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    mem_limit: 2g
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      <<: *postgres-env
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    <<: *restart
    mem_limit: 256m
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2
    <<: *restart
    mem_limit: 1.5g
    logging: *logging
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TZ: ${TZ}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/secret_guard.py:/app/secret_guard.py:ro
    networks: [internal, agents, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.35.1
    <<: *restart
    mem_limit: 1g
    logging: *logging
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-data:/root/.ollama
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    <<: *restart
    mem_limit: 2g
    logging: *logging
    ports:
      - "${BIND_IP}:3000:8080"
    environment:
      ENABLE_SIGNUP: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      VECTOR_DB: pgvector
      ENABLE_OLLAMA_API: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_OPENAI_API_KEY}
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      HF_HUB_OFFLINE: "1"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      WEBUI_URL: https://${APP_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: ${TZ}
    volumes:
      - openwebui-data:/app/backend/data
      - ./open-webui/functions:/app/backend/data/functions:ro
      - type: bind
        source: /data/uploads
        target: /app/backend/data/uploads
        bind:
          create_host_path: false
    networks: [frontend, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  browser:
    build: ./browser
    image: ai-stack-browser:local
    <<: *restart
    mem_limit: 2.5g
    logging: *logging
    ports:
      - "${BIND_IP}:6080:6080"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD}
      TZ: ${TZ}
      BROWSER_LANG: ${BROWSER_LANG}
      PROXY_HOST: proxy-web
      PROXY_PORT: "8888"
    volumes:
      - browser-profile:/browser-profile
    networks: [browser, novnc]
    shm_size: "512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9222/json/version >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  safeguard-gateway:
    build: ./gateway
    image: ai-stack-gateway:local
    <<: *restart
    mem_limit: 256m
    logging: *logging
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      MCP_ENDPOINT: http://browser:8931
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orchestrator
      POLICY_FILE: /app/policy.yaml
      PERSONAL_ALLOW_DOMAINS: ${PERSONAL_ALLOW_DOMAINS:-}
      TZ: ${TZ}
    volumes:
      - ./gateway/policy.yaml:/app/policy.yaml:ro
    networks: [internal, browser, egress]
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  orchestrator:
    build: ./orchestrator
    image: ai-stack-orchestrator:local
    <<: *restart
    mem_limit: 1g
    logging: *logging
    environment:
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
      GATEWAY_URL: http://safeguard-gateway:8000
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orchestrator
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      RUNNER_IMAGE: ${RUNNER_IMAGE}
      WORKSPACE_REPOS: ${WORKSPACE_REPOS}
      TZ: ${TZ}
    volumes:
      - type: bind
        source: /data/workspaces
        target: /workspace
        bind:
          create_host_path: false
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      safeguard-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    <<: *restart
    mem_limit: 64m
    logging: *logging
    environment:
      CONTAINERS: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/version >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  proxy-web:
    build: ./proxies
    image: ai-stack-tinyproxy:local
    <<: *restart
    mem_limit: 64m
    logging: *logging
    volumes:
      - ./proxies/web.conf:/etc/tinyproxy/tinyproxy.conf:ro
    networks: [browser, egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ >/dev/null 2>&1 || true"]
      interval: 15s
      timeout: 5s
      retries: 5

  proxy-dev:
    image: ai-stack-tinyproxy:local
    <<: *restart
    mem_limit: 64m
    logging: *logging
    volumes:
      - ./proxies/dev.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./proxies/dev-filter.txt:/etc/tinyproxy/filter:ro
    networks: [agents, egress]
    depends_on: [proxy-web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ >/dev/null 2>&1 || true"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  pgbackup:
    build: ./pgbackup
    image: ai-stack-pgbackup:local
    <<: *restart
    mem_limit: 128m
    logging: *logging
    environment:
      <<: *postgres-env
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - type: bind
        source: /data/backups
        target: /backups
        bind:
          create_host_path: false
      - openwebui-data:/openwebui-data:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore_test.sh:/usr/local/bin/restore_test.sh:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  frontend: {}
  internal:
    internal: true
  browser:
    internal: true
  agents:
    internal: true
  egress: {}
  # Non-internal; exists only so Docker can publish the noVNC port (6080).
  # Docker cannot publish ports from `internal: true` networks.
  novnc: {}

volumes:
  pgdata:
  openwebui-data:
  ollama-data:
  browser-profile:
