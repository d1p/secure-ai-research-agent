apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    editable: false

  - name: LiteLLM Postgres
    type: postgres
    access: proxy
    uid: postgres-litellm
    url: postgres:5432
    database: litellm
    user: ${POSTGRES_USER}
    jsonData:
      sslmode: disable
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    editable: false
