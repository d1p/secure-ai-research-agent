# =============================================================================
# OpenTelemetry Collector — fan out application traces to both backends.
#
# Applications send OTLP to otel-collector:4317 (gRPC) or :4318 (HTTP).
# The collector forwards every trace to:
#   * Tempo   — Grafana trace waterfall / TraceQL dashboards
#   * Phoenix — LLM observability, evals and prompt/trace inspection
#
# Phoenix authentication is enabled, so the Phoenix exporter sends the system
# API key from PHOENIX_API_KEY (created once in the Phoenix UI/API).
# =============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  resource:
    attributes:
      - key: openinference.project.name
        value: ai-stack
        action: upsert
  # Drop high-volume, low-value spans before they reach Tempo/Phoenix:
  #  - Open WebUI emits one ``... http send`` span per streamed chunk (thousands
  #    per chat turn) and a ``connect`` span per DB health probe. Together these
  #    produced multi-thousand-span traces and OOM-killed Tempo.
  #  - Container healthcheck probes are not useful as traces.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".* http send$")'
        - 'IsMatch(name, "(?i).*/health.*")'
        - 'name == "connect" and attributes["db.system"] != nil'

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/phoenix:
    endpoint: http://phoenix:6006
    headers:
      authorization: "Bearer ${env:PHOENIX_API_KEY}"
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, resource, batch]
      exporters: [otlp_grpc/tempo, otlp_http/phoenix]
  telemetry:
    logs:
      level: info
