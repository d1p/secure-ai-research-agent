# Tempo trace backend (local filesystem, no external object store).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.x: ingesters and the compactor were replaced by live-store,
# block-builder and the backend scheduler/worker. In monolithic mode those run
# in-process; retention is set on the backend worker's compaction config.
backend_worker:
  compaction:
    block_retention: 168h

# Tempo 3.x "new" overrides format. These caps protect the single-binary
# instance from oversized traces and runaway Traces Drilldown tag scans.
overrides:
  defaults:
    global:
      max_bytes_per_trace: 2000000
    read:
      # Traces Drilldown asks for tag values with limit=5000; cap the block scan
      # so one filter query cannot read every block and saturate disk I/O.
      max_blocks_per_tag_values_query: 50
      max_bytes_per_tag_values_query: 1000000

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
