# Prometheus scrape configuration.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Container-level CPU/memory/network metrics for every stack container.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # LiteLLM metrics served on the dedicated (unauthenticated) port 4001.
  # `prometheus` callback must be enabled in litellm/config.yaml.
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4001"]

  # Tempo query/compaction metrics (query latency, block churn, memory pressure).
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # Reader/web-loader counters (plans/05-observability.md)
  - job_name: safeguard-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["safeguard-gateway:8000"]

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8080"]
