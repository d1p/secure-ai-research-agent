# Pinned pre-commit hooks. Run `pre-commit run --all-files` before pushing.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/.*\.(html|txt|md|json)$
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/.*\.(html|txt|md|json)$
      - id: check-yaml
      - id: check-json
        exclude: ^tests/fixtures/.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=4096]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: privacy
        name: privacy (emails/private IPs/internal hosts)
        entry: .venv/bin/python scripts/check_privacy.py
        language: system
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: npx --yes markdownlint-cli2
        language: system
        types: [markdown]
        pass_filenames: true
